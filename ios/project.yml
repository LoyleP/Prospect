# Xcode project definition. Regenerate Prospect.xcodeproj after editing:
#   cd ios && xcodegen
name: Prospect
options:
  bundleIdPrefix: com.flow
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: BJ66V252MG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Base URL of the Prospect API (the Vercel deployment of api/). Change it here, then run xcodegen.
    API_BASE_URL: https://prospect-api.vercel.app

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  Prospect:
    type: application
    platform: iOS
    sources:
      - path: Prospect
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.Prospect
        PRODUCT_NAME: Prospect
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Config/Prospect-Info.plist
      properties:
        CFBundleDisplayName: Prospect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APIBaseURL: $(API_BASE_URL)
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Permet de se connecter au serveur de développement sur votre réseau local.
        # Lets Debug builds talk to a local API (npm run dev → http://localhost:3000).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: KeychainAccess
      - target: ProspectLiveActivity
        embed: true

  ProspectLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        type: syncedFolder
      # Shared with the app: the attributes both sides of the Live Activity agree on.
      - path: Prospect/Models/SessionActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.Prospect.LiveActivity
        PRODUCT_NAME: ProspectLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    info:
      path: Config/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Prospect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ProspectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProspectTests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.ProspectTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prospect

  ProspectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProspectUITests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.ProspectUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Prospect
    dependencies:
      - target: Prospect

schemes:
  Prospect:
    build:
      targets:
        Prospect: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProspectTests
        - ProspectUITests   # skips itself unless PROSPECT_E2E=1 (see the file header)
    archive:
      config: Release
