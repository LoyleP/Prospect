# Xcode project definition. Regenerate Prospect.xcodeproj after editing:
#   cd ios && xcodegen
name: Prospect
options:
  bundleIdPrefix: com.flow
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: BJ66V252MG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2

targets:
  Prospect:
    type: application
    platform: iOS
    sources:
      - path: Prospect
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.Prospect
        PRODUCT_NAME: Prospect
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # SwiftUI previews use Debug-only demo data: keep them out of Release/TestFlight builds.
      configs:
        Debug:
          ENABLE_PREVIEWS: YES
        Release:
          ENABLE_PREVIEWS: NO
    info:
      path: Config/Prospect-Info.plist
      properties:
        CFBundleDisplayName: Prospect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        # The app's languages (also what the App Store lists). English is the default.
        CFBundleLocalizations:
          - en
          - fr
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera is used to scan the organizer's invitation.
        # Phone-to-phone transfer (Multipeer): the system asks for local network access the first time.
        NSLocalNetworkUsageDescription: Prospect exchanges prospects directly between nearby phones, without a server.
        NSBonjourServices:
          - _prospect-sync._tcp
          - _prospect-sync._udp
        # prospect://join?i=… opens an invitation.
        CFBundleURLTypes:
          - CFBundleURLName: com.flow.Prospect
            CFBundleURLSchemes:
              - prospect
        # An agent's end-of-day file (.prospects), encrypted to the organizer; AirDrop and Mail open it in Prospect.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.flow.prospect.handover
            UTTypeDescription: Prospect handover
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - prospects
        # Apple requires one of the two document keys: a handover file is copied in, never edited in place.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Prospect handover
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.flow.prospect.handover
    dependencies:
      - package: KeychainAccess
      - target: ProspectLiveActivity
        embed: true

  ProspectLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        type: syncedFolder
      # Shared with the app: the attributes both sides of the Live Activity agree on.
      - path: Prospect/Models/SessionActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.Prospect.LiveActivity
        PRODUCT_NAME: ProspectLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
    info:
      path: Config/LiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Prospect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ProspectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProspectTests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.ProspectTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prospect

  ProspectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProspectUITests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flow.ProspectUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Prospect
    dependencies:
      - target: Prospect

schemes:
  Prospect:
    build:
      targets:
        Prospect: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProspectTests
        - ProspectUITests   # skips itself unless PROSPECT_E2E=1 (see the file header)
    archive:
      config: Release
